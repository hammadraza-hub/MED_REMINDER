name: Firebase CI/CD

# ============================================================
# Triggers:
#   - PR to main → run Firestore rules tests
#   - Push to main (merge) → tests + deploy to staging
#   - Release tag (v*) → deploy to production
#   - Manual dispatch → optional staging/prod deploy
# ============================================================
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  # ============================================================
  # JOB 1: Test Firestore Security Rules
  # Runs on: PR + push to main
  # Uses Firebase Emulator + Jest to run security tests
  # ============================================================
  test-rules:
    name: Test Firestore Security Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21 (for Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install dependencies
        run: npm install

      - name: Run Firestore Security Rules tests on emulator
        run: firebase emulators:exec --only firestore "npx jest tests/firestore.rules.test.js --runInBand"

  # ============================================================
  # JOB 2: Deploy to Staging (on merge to main)
  # Deploys: Firestore rules + indexes only (Storage needs Blaze)
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    needs: test-rules
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules + indexes to staging
        uses: w9jds/firebase-action@v2.0.0
        with:
          args: deploy --only firestore:rules,firestore:indexes --project staging
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_STAGING }}

  # ============================================================
  # JOB 3: Deploy to Production (on release tag)
  # ============================================================
  deploy-production:
    name: Deploy to Production
    needs: test-rules
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules + indexes to production
        uses: w9jds/firebase-action@v2.0.0
        with:
          args: deploy --only firestore:rules,firestore:indexes --project prod
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_PRODUCTION }}